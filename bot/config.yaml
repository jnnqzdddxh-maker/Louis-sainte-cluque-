  price_volume_liquidity:
    # Baissé de 5000$ à 1500$ le 14/09/2026 : à 5000$, le filtre rejetait
    # presque tous les tokens tout juste créés (trop jeunes pour avoir déjà
    # accumulé cette liquidité), donc quasi aucun candidat ne passait.
    # Compromis assumé : moins de protection contre un rug direct.
    min_liquidity_usd: 1500           # filtre anti-rug : liquidité minimale
    max_top_holder_concentration_pct: 30   # filtre anti-rug : concentration max du top holder (hors LP/burn)
    volume_spike_window_minutes: 15
    volume_spike_multiplier: 2.0      # volume actuel / volume moyen historique pour "momentum"
    # Ajouté le 14/09/2026 : pour un token sans 7 jours d'historique (le cas
    # normal pour un candidat tout juste créé, repéré par le scan "nouveaux
    # tokens"), il n'y a pas de "volume moyen historique" à comparer.
    # volume_spike_multiplier ne s'applique donc pas -> on compare plutôt le
    # volume 24h à la liquidité (métrique indépendante de l'âge du token).
    # Volume 24h >= 1.5x la liquidité -> score momentum plein (50/50). Avant
    # cet ajout, ce cas retombait à 0, plafonnant tout token frais à un score
    # total de 16/100 (sous le seuil "moyenne" à 20) quel que soit son
    # momentum de prix -> aucune position n'était jamais ouverte via le scan
    # de marché seul, même après correction du bug de breakout (voir README).
    fresh_token_volume_to_liquidity_multiplier: 1.5
    breakout_lookback_minutes: 60     # fenêtre pour détecter une cassure de résistance

    # Légitimité (bonus dans le sous-score marché, pas éliminatoire) :
    # liens sociaux déclarés + appairage avec un actif de référence plutôt
    # qu'un token obscur. Voir core/scoring.py:_market_subscore.
    recognized_quote_tokens:
      solana: ["SOL", "USDC", "USDT"]
      robinhood: ["ETH", "WETH", "USDC", "USDT"]

    # Filtre anti-rug ÉLIMINATOIRE (ajouté le 14/09/2026) : rejette un token
    # Solana si l'autorité de mint (le créateur peut créer des tokens à
    # l'infini) ou de freeze (le créateur peut geler vos tokens) n'est pas
    # révoquée on-chain. Vérifié via RPC (connectors/solana_data.py:
    # HeliusClient.get_mint_authorities) — sans rapport avec Robinhood Chain
    # (pas de notion équivalente standardisée sur les tokens ERC20).
    require_renounced_authorities: true

  twitter:
    poll_interval_minutes: 5          # veille périodique, pas de streaming temps réel
    tracked_accounts: []              # à remplir
    keywords: []                      # à remplir
    max_signal_age_minutes: 30        # une mention plus vieille que ça ne compte plus

  confidence_thresholds:
    # score total (0-100) -> niveau de confiance
    # Baissé de 39 à 19 le 14/09/2026 : à 39, un candidat repéré uniquement
    # par le scan (sans wallet, plafonné à ~55/100 max) devait avoir un score
    # marché quasi parfait pour devenir tradable — trop strict, le bot
    # n'ouvrait jamais aucune position. Compromis assumé : plus de trades,
    # sur des signaux plus faibles.
    # medium_max et high_max baissés aussi le 14/09/2026 (demande explicite :
    # "baisser chaque palier un peu") — 84 était hors d'atteinte même pour
    # un score marché parfait sans wallet (plafond ~55/100), donc "haute"
    # était quasi jamais atteint côté scan seul. 70 reste au-dessus de ce
    # plafond de 55 : un token SANS corroboration wallet ne peut toujours
    # pas atteindre "très haute" ni débloquer le palier x100 — cette
    # propriété (x100 réservé aux tokens corroborés par un wallet) est
    # intentionnellement préservée malgré la baisse.
    low_max: 19         # 0-19   -> faible
    medium_max: 50       # 20-50  -> moyenne
    high_max: 70         # 51-70  -> haute
    # >= 71                        -> très haute (seul niveau qui débloque le palier x100)

# ----------------------------------------------------------------------------
# Sizing et garde-fous globaux
# ----------------------------------------------------------------------------
sizing:
  position_size_min_eur: 20
  position_size_max_eur: 50
  # Phase 1 du plan de validation (section 7) : ne pas dépasser le min tant
  # que le comportement réel n'est pas éprouvé. Ce flag force 20€ partout
  # même si position_size_max_eur est plus haut ; à désactiver à la main.
  force_minimum_size_until_proven: true

risk:
  # Stop-loss catastrophe, actif uniquement AVANT le palier x2.
  # Protège contre un rug direct sans sortir sur du bruit normal.
  catastrophe_stop_loss_pct: -65     # doit rester entre -60 et -70

  # Plafond de perte journalière global : point ouvert (section 8),
  # valeur volontairement conservatrice en attendant une décision explicite.
  # Le bot s'arrête et repasse en pause manuelle si la perte du jour dépasse
  # CE MONTANT ou CE POURCENTAGE, selon ce qui est atteint en premier.
  daily_loss_cap_eur: 100
  # Alignée sur daily_loss_cap_eur / capital_eur (100/500) pour que les deux
  # seuils se déclenchent au même endroit, pas l'un avant l'autre.
  daily_loss_cap_pct_of_capital: 20
  daily_loss_cap_action: halt_and_require_manual_validation
  # Capital total engagé sur le bot — sert de base au plafond en %.
  capital_eur: 500

  # Nombre max de positions ouvertes simultanément — point ouvert (section 8),
  # valeur de départ prudente à ajuster selon le capital total engagé.
  max_open_positions: 5

  # Kill-switch : une fois déclenché (perte journalière ou erreur système
  # critique), le bot ne reprend QUE via reset manuel explicite (voir
  # core/risk_guard.py -> RiskGuard.manual_reset()).
  require_manual_reset_after_halt: true

# ----------------------------------------------------------------------------
# Stratégie de sortie — paliers de sécurisation en escalier (section 5)
# ----------------------------------------------------------------------------
exit_strategy:
  # % de trailing take-profit entre les paliers, selon le niveau de
  # confiance INITIAL du token (fixé à l'entrée, ne change jamais en cours de vie).
  trailing_pct_by_confidence:
    faible: 10
    moyenne: 18
    haute: 25
    tres_haute: 25

  # Trailing élargi une fois x20 dépassé, réservé à la confiance très haute.
  trailing_pct_beyond_x20_tres_haute: 50

  # SL manuel/large appliqué au-delà de x20 quand il n'y a pas de palier x100
  # (confiance faible/moyenne), et sur le tout dernier reliquat après x100.
  manual_trailing_pct_beyond_cap: 50

  tiers:
    - multiple: 2
      sell_pct_of_remaining: 40
      on_remainder: breakeven          # SL remonte au prix d'entrée net des frais
    - multiple: 5
      sell_pct_of_remaining: 0         # pas de vente, juste verrouillage du SL
      on_remainder: lock_x2
    - multiple: 10
      sell_pct_of_remaining: 75
      on_remainder: lock_x5
    - multiple: 20
      sell_pct_of_remaining: 75
      on_remainder: lock_x10
    - multiple: 100
      sell_pct_of_remaining: 75
      on_remainder: manual_beyond      # gestion manuelle possible au-delà
      requires_confidence: tres_haute  # ne se déclenche QUE si confiance initiale = très haute

execution:
  # Un token de confiance "faible" reste affiché au dashboard (transparence)
  # mais n'est jamais tradé, ni en dry-run ni en live.
  min_confidence_to_trade: moyenne
  price_poll_interval_seconds: 15
  candidate_rescan_interval_seconds: 30

# Scan de marché autonome : découvre des candidats SANS attendre qu'un
# wallet suivi achète (contrairement à scoring.wallet_tracker). Un token
# trouvé ici est quand même scoré avec les 3 signaux (le signal wallet sera
# juste à 0 la plupart du temps) — voir core/engine.py:on_market_scan_hit
# pour la conséquence sur le score max atteignable.
market_scan:
  # "Nouveaux tokens" : la priorité pour catcher tôt (x2->x100 suppose de
  # rentrer avant que le token ait déjà pris son envol). Intervalle plus
  # court : c'est celui qui compte le plus pour la stratégie.
  new_listings:
    enabled: true
    # Rebasculé sur DexPaprika (gratuit, sans clé) le 14/09/2026 — Birdeye
    # ("Compute units usage limit exceeded") coûtait un quota payant pour
    # ce scan. Le scoring/fetch d'un candidat détecté continue d'utiliser
    # Birdeye ensuite (get_token_overview, usage bien plus léger).
    solana_enabled: true
    interval_seconds: 60
    tokens_per_scan: 20

  # "Tendances" (plus gros volume actuel) : complément, filet de sécurité
  # qui peut aussi remonter un token qui accélère fort après son lancement.
  # Remonte souvent des tokens déjà bien montés — x100 probablement déjà
  # raté dessus, mais x2-x5 peut rester pertinent.
  trending:
    enabled: true
    solana_enabled: true  # même raison que new_listings ci-dessus (DexPaprika, gratuit)
    interval_seconds: 300
    tokens_per_scan: 20

  # Stablecoins ET monnaie native de la chaîne à ignorer complètement (jamais
  # scorés, jamais affichés) : ils dominent les classements "plus gros
  # volume" parce qu'ils servent de monnaie de cotation partout. Un
  # stablecoin ne bougera jamais assez pour que l'escalier x2->x100 ait un
  # sens ; la monnaie native (SOL, ETH) PEUT bouger mais n'est pas non plus
  # le genre de petit token que cette stratégie vise — acheter SOL lui-même
  # (repéré le 11/09/2026 via le scan tendances) n'a pas de sens ici.
  # S'applique aussi aux tokens repérés via le wallet tracker.
  excluded_tokens:
    solana:
      - "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"  # USDC
      - "Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB"  # USDT
      - "So11111111111111111111111111111111111111112"  # SOL (wrapped)
    robinhood: []  # à compléter si un stablecoin/WETH apparaît dans le bruit du scan

  # Ajouté le 15/09/2026 : observé en dry-run réel, la quasi-totalité (24 sur
  # 38 dans le log analysé) des rejets anti-rug Solana affichaient une
  # liquidité EXACTEMENT à 0$, pas juste sous le seuil. Cause : le scan
  # "nouveaux tokens" capture chaque pool pump.fun à la seconde de sa
  # création, avant que DexPaprika ait indexé sa vraie liquidité (le bonding
  # curve a pourtant du SOL derrière dès le premier achat) -- et comme
  # pump.fun crée des dizaines de tokens/minute, un token ne reste dans le
  # top 20 "plus récents" qu'un seul cycle de scan avant d'être poussé hors
  # de la liste par des tokens encore plus récents : il n'est donc jamais
  # réévalué, même si sa liquidité réelle dépasse le seuil deux minutes plus
  # tard. Baisser encore min_liquidity_usd n'aurait presque rien changé (la
  # plupart des rejets sont à 0$ pile). La vraie correction : garder en
  # mémoire un token rejeté UNIQUEMENT pour liquidité insuffisante (pas pour
  # mint/freeze authority révoquée, qui ne change jamais) et le réévaluer
  # automatiquement pendant quelques minutes, indépendamment de sa présence
  # dans les scans suivants -- voir core/engine.py:TradingEngine.
  # recheck_liquidity_watchlist et dry_run.py:liquidity_watchlist_loop.
  liquidity_watchlist:
    enabled: true
    recheck_interval_seconds: 30
    max_age_minutes: 15    # au-delà, on abandonne (probablement mort-né)
    max_attempts: 30       # ceinture-bretelles si max_age_minutes est mal calé

fees:
  # Point ouvert (section 8) : à vérifier précisément sur Robinhood Chain
  # une fois la période de gas gratuit terminée (90 jours).
  include_fees_in_breakeven: true
  estimated_swap_fee_pct:
    solana: 0.1
    robinhood: 0.0   # gratuit pendant gas_free_period_days, à réévaluer après

# ----------------------------------------------------------------------------
# Secrets — NE JAMAIS mettre de vraie clé ici. Ce ne sont que des noms de
# variables d'environnement, lues via bot/core/secrets.py.
# ----------------------------------------------------------------------------
secrets:
  solana_wallet_private_key_env: SOLANA_WALLET_PRIVATE_KEY
  robinhood_wallet_private_key_env: ROBINHOOD_WALLET_PRIVATE_KEY
  birdeye_api_key_env: BIRDEYE_API_KEY
  helius_api_key_env: HELIUS_API_KEY
  bitquery_api_key_env: BITQUERY_API_KEY
  dexpaprika_api_key_env: DEXPAPRIKA_API_KEY

dashboard:
  # 0.0.0.0 : écoute sur toutes les interfaces réseau (pas seulement la
  # machine locale), nécessaire pour y accéder via Tailscale ou le wifi
  # local. Le dashboard n'a AUCUNE authentification — acceptable sur un
  # réseau privé (wifi maison, Tailscale), à ne jamais exposer directement
  # sur l'internet public (pas de redirection de port sur la box) sans
  # ajouter un mot de passe d'abord.
  host: 0.0.0.0
  port: 8787

logging:
  # Chemins relatifs au répertoire de lancement — les scripts (dry_run.py,
  # main.py, pytest) sont prévus pour être lancés depuis l'intérieur de bot/.
  decisions_log_path: logs/decisions.jsonl
  state_db_path: logs/state.sqlite3
